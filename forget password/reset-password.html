<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jusoor - Set New Password</title>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body.forgot-password-page {
            background-color: #e8f4ed;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .forgot-box {
            background: #ffffff;
            border-radius: 16px;
            padding: 3rem 2.5rem;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        .shield-icon {
            background-color: #e8f4ed;
            color: #388e3c;
            width: 70px;
            height: 70px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin: 0 auto 1.5rem;
        }

        .forgot-box h2 {
            color: #1a202c;
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .forgot-box p.subtitle {
            color: #718096;
            font-size: 1rem;
            margin-bottom: 2rem;
        }

        /* Step Progress Bar */
        .steps-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            margin-bottom: 2.5rem;
            padding: 0 20px;
        }

        .steps-wrapper::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 20px;
            right: 20px;
            height: 3px;
            background-color: #388e3c; /* All lines green */
            z-index: 1;
            transform: translateY(-50%);
        }

        .step-circle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #e2e8f0;
            color: #4a5568;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 1.1rem;
            position: relative;
            z-index: 2;
        }

        .step-circle.completed, .step-circle.active {
            background-color: #388e3c;
            color: #ffffff;
        }

        .alert-success {
            background-color: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: #16a34a;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 10px;
            font-size: 0.95rem;
            font-weight: 500;
            text-align: left;
        }

        /* Form styling */
        .form-group {
            text-align: left;
            margin-bottom: 1.2rem;
        }

        .form-label {
            display: block;
            color: #4a5568;
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
        }

        .input-icon-wrapper {
            position: relative;
        }

        .input-icon-wrapper .icon-left {
            position: absolute;
            top: 50%;
            left: 15px;
            transform: translateY(-50%);
            color: #a0aec0;
            font-size: 1.1rem;
        }

        .input-icon-wrapper .icon-right {
            position: absolute;
            top: 50%;
            right: 15px;
            transform: translateY(-50%);
            color: #a0aec0;
            font-size: 1.1rem;
            cursor: pointer;
        }
        
        .input-icon-wrapper .icon-right:hover {
            color: #718096;
        }

        .form-control {
            width: 100%;
            padding: 12px 45px 12px 45px; /* Space for both icons */
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
            box-sizing: border-box;
            background-color: #f8fafc;
        }

        .form-control:focus {
            border-color: #388e3c;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(56, 142, 60, 0.1);
        }

        /* Password strength indicator */
        .password-strength-container {
            margin-top: 8px;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .strength-text {
            font-weight: 600;
            font-size: 0.85rem;
            min-width: 55px;
            text-align: right;
        }

        .password-strength-bars {
            display: flex;
            gap: 5px;
            flex: 1;
        }

        .strength-bar {
            height: 4px;
            flex: 1;
            background-color: #e2e8f0;
            border-radius: 2px;
            transition: background-color 0.3s;
        }

        .btn-submit {
            background-color: #388e3c;
            color: #ffffff;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #2e7d32;
        }

        .divider {
            height: 1px;
            background-color: #edf2f7;
            margin: 2rem 0;
        }

        .login-link {
            color: #718096;
            font-size: 1rem;
            text-decoration: none;
        }

        .login-link a {
            color: #388e3c;
            font-weight: 600;
            text-decoration: none;
        }
        
        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body class="forgot-password-page">
    <div class="forgot-box">
        <div class="shield-icon">
            <i class="fas fa-shield-alt"></i>
        </div>
        
        <h2>Set New Password</h2>
        <p class="subtitle">Create a new strong password for your account</p>
        
        <div class="steps-wrapper">
            <div class="step-circle completed"><i class="fas fa-check"></i></div>
            <div class="step-circle completed"><i class="fas fa-check"></i></div>
            <div class="step-circle active">3</div>
        </div>

        <div class="alert-success">
            <i class="fas fa-check-circle"></i> Code verified successfully
        </div>

        <form action="#" method="POST" id="resetPasswordForm">
            <div class="form-group">
                <label class="form-label">New Password</label>
                <div class="input-icon-wrapper">
                    <i class="fas fa-lock icon-left"></i>
                    <input type="password" class="form-control" id="newPassword" placeholder="••••••••" required>
                    <i class="far fa-eye icon-right toggle-password" data-target="newPassword"></i>
                </div>
            </div>

            <div class="password-strength-container">
                <div class="password-strength-bars">
                    <div class="strength-bar" id="bar-1"></div>
                    <div class="strength-bar" id="bar-2"></div>
                    <div class="strength-bar" id="bar-3"></div>
                </div>
                <span class="strength-text" id="strengthText"></span>
            </div>

            <div class="form-group">
                <label class="form-label">Confirm Password</label>
                <div class="input-icon-wrapper">
                    <i class="fas fa-lock icon-left"></i>
                    <input type="password" class="form-control" id="confirmPassword" placeholder="••••••••" required>
                    <i class="far fa-eye icon-right toggle-password" data-target="confirmPassword"></i>
                </div>
            </div>

            <button type="submit" class="btn-submit">Reset Password</button>
        </form>

        <div class="divider"></div>
        
        <div class="login-link">
            Remembered your password? <a href="../volnteer/login.html">Log in</a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Toggle Password Visibility
            const togglePasswords = document.querySelectorAll('.toggle-password');
            togglePasswords.forEach(icon => {
                icon.addEventListener('click', function() {
                    const targetId = this.getAttribute('data-target');
                    const input = document.getElementById(targetId);
                    if (input) {
                        if (input.type === 'password') {
                            input.type = 'text';
                            this.classList.remove('fa-eye');
                            this.classList.add('fa-eye-slash');
                        } else {
                            input.type = 'password';
                            this.classList.remove('fa-eye-slash');
                            this.classList.add('fa-eye');
                        }
                    }
                });
            });

            // Password Strength Logic
            const newPassword = document.getElementById('newPassword');
            const strengthText = document.getElementById('strengthText');
            const bars = [
                document.getElementById('bar-1'),
                document.getElementById('bar-2'),
                document.getElementById('bar-3')
            ];

            newPassword.addEventListener('input', function() {
                const val = this.value;
                let strength = 0;
                
                if (val.length >= 8) strength += 1;
                if (val.match(/[A-Za-z]+/)) strength += 1;
                if (val.match(/[0-9]+/)) strength += 1;
                if (val.match(/[$@#&!]+/)) strength += 1;

                // Reset bars
                bars.forEach(bar => bar.style.backgroundColor = '#e2e8f0');

                if (val.length === 0) {
                    strengthText.textContent = "Too weak";
                    strengthText.style.color = '#a0aec0';
                } else if (strength <= 2) {
                    strengthText.textContent = "Weak";
                    strengthText.style.color = '#ef4444'; // Red
                    bars[0].style.backgroundColor = '#ef4444';
                } else if (strength === 3) {
                    strengthText.textContent = "Medium";
                    strengthText.style.color = '#eab308'; // Yellow
                    bars[0].style.backgroundColor = '#eab308';
                    bars[1].style.backgroundColor = '#eab308';
                } else {
                    strengthText.textContent = "Strong";
                    strengthText.style.color = '#22c55e'; // Green
                    bars[0].style.backgroundColor = '#22c55e';
                    bars[1].style.backgroundColor = '#22c55e';
                    bars[2].style.backgroundColor = '#22c55e';
                }
            });
            
            // Redirect to login after successful reset
            document.getElementById('resetPasswordForm').addEventListener('submit', function(e) {
                e.preventDefault();
                alert("Password has been reset successfully!");
                window.location.href = 'login.html';
            });
        });
    </script>
</body>
</html>
