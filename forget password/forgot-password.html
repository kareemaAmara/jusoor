<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jusoor - Reset Password</title>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body.forgot-password-page {
            background-color: #e8f4ed; /* Light green background to match screenshot */
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .forgot-box {
            background: #ffffff;
            border-radius: 16px;
            padding: 3rem 2.5rem;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        .shield-icon {
            background-color: #e8f4ed;
            color: #388e3c;
            width: 70px;
            height: 70px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin: 0 auto 1.5rem;
        }

        .forgot-box h2 {
            color: #1a202c;
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .forgot-box p.subtitle {
            color: #718096;
            font-size: 1rem;
            margin-bottom: 2rem;
        }

        /* Step Progress Bar */
        .steps-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            margin-bottom: 2.5rem;
            padding: 0 20px;
        }

        .steps-wrapper::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 20px;
            right: 20px;
            height: 3px;
            background-color: #e2e8f0;
            z-index: 1;
            transform: translateY(-50%);
        }

        .step-circle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #e2e8f0;
            color: #4a5568;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 1.1rem;
            position: relative;
            z-index: 2;
        }

        .step-circle.active {
            background-color: #388e3c;
            color: #ffffff;
        }

        /* Form */
        .form-group {
            text-align: left;
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            color: #4a5568;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .input-icon-wrapper {
            position: relative;
        }

        .input-icon-wrapper i {
            position: absolute;
            top: 50%;
            left: 15px; /* LTR */
            transform: translateY(-50%);
            color: #a0aec0;
            font-size: 1.2rem;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px 12px 45px; /* Space for icon on the left */
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .form-control:focus {
            border-color: #388e3c;
            box-shadow: 0 0 0 3px rgba(56, 142, 60, 0.1);
        }

        .btn-submit {
            background-color: #388e3c;
            color: #ffffff;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-submit:hover {
            background-color: #2e7d32;
        }

        .divider {
            height: 1px;
            background-color: #edf2f7;
            margin: 2rem 0;
        }

        .login-link {
            color: #718096;
            font-size: 1rem;
            text-decoration: none;
        }

        .login-link a {
            color: #388e3c;
            font-weight: 600;
            text-decoration: none;
        }
        
        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body class="forgot-password-page">
    <div class="forgot-box">
        <div class="shield-icon">
            <i class="fas fa-shield-alt"></i>
        </div>
        
        <h2>Reset Password</h2>
        <p class="subtitle">Enter your email address to reset your password</p>
        
        <div class="steps-wrapper">
            <div class="step-circle active">1</div>
            <div class="step-circle">2</div>
            <div class="step-circle">3</div>
        </div>

        <form id="forgotPasswordForm">
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <div class="input-icon-wrapper">
                    <i class="far fa-envelope"></i>
                    <input type="email" id="emailInput" class="form-control" placeholder="name@company.com" required>
                </div>
            </div>

            <button type="submit" class="btn-submit">
                Send Verification Code
                <i class="fas fa-arrow-right"></i>
            </button>
        </form>

        <div class="divider"></div>
        
        <div class="login-link">
            Remembered your password? <a href="../volnteer/login.html">Log in</a>
        </div>
    </div>

    <script>
        document.getElementById('forgotPasswordForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('emailInput').value;
            window.location.href = `verify-code.html?email=${encodeURIComponent(email)}`;
        });
    </script>
</body>
</html>
